# Proposal for the csp-ticketing-api pipeline (lives in the fork, not active in the team repository).
name: security

on:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Dependency audit
        run: mvn -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7

  authorization-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Proposal: csp-ticketing-api has no deploy/compose.yml yet; the Norma template (api-java/deploy) defines it.
      - name: Start ticketing-fulfillment-service
        run: docker compose -f deploy/compose.yml up -d --wait ticketing-fulfillment-service
      - name: Negative authorization test (ticketing /me/tickets)
        run: java 13-week/workshop/04-security-ci/TicketingAuthzNegativeTest.java
